# octosense-appstore — the store, as an OctoSense app (ADR 0003 §7).
#
# Trusted tier by necessity: it holds the hub anchor, writes app jails and is
# the one place that installs. It ships in the build like any other module,
# and like any other module it also runs standalone through octosense-app-host.
[package]
name = "octosense-appstore"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Browse, search, install and open apps published to the OctoSense app hub"

[dependencies]
octosense-app-hub = { path = "../app-hub" }
octosense-app-policy = { path = "../app-policy", features = ["splash"] }
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "4531e695251f03bf8b248075491691ecf77ecdaf" }
makepad-app-module = { git = "https://github.com/OctoSense-org/makepad.git", rev = "4531e695251f03bf8b248075491691ecf77ecdaf" }
octoscript-makepad = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "bbb9f69fa62858e775058ab743047746e432bfaa" }
octoscript-widgets = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "bbb9f69fa62858e775058ab743047746e432bfaa" }
serde_json = "1"

