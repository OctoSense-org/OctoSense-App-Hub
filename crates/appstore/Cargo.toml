# octosense-appstore — the store, as an OctoSense app (ADR 0003 §7).
#
# Trusted tier by necessity: it holds the hub anchor, writes app jails and is
# the one place that installs. It ships in the build like any other module,
# and like any other module it also runs standalone through octosense-app-host.
[package]
name = "octosense-appstore"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Browse, search, install and open apps published to the OctoSense app hub"

[dependencies]
octosense-app-hub = { path = "../app-hub" }
octosense-app-policy = { path = "../app-policy", features = ["splash"] }
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "c155f61d0e1600d2ec474209374444a38a09a470" }
makepad-app-module = { git = "https://github.com/OctoSense-org/makepad.git", rev = "c155f61d0e1600d2ec474209374444a38a09a470" }
octoscript-makepad = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "2cc5ef37d7d6a3d2992673389ce74488f7bb2d87" }
octoscript-widgets = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "2cc5ef37d7d6a3d2992673389ce74488f7bb2d87" }
serde_json = "1"

