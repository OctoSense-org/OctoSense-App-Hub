# octosense-card-host — the contained tier, end to end (ADR 0002).
#
# Runs ONE card bundle: admits it against its manifest, resolves the policy,
# applies it to a splash isolate, and evaluates the card inside that isolate.
# It is the reference for how a card should be mounted, and the harness the
# later phases (capability checks, network allowlist, budgets) are tested in.
#
# Note the difference from kit-host's `beauty` preview, which evaluates a card
# in the MAIN vm and swaps the resulting view into a Splash: that is a trusted
# developer tool and gives a card no containment at all. This host uses the
# same path the shipping AppCard does — hand the card's source to the isolate.
[package]
name = "octosense-card-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Runs one card bundle inside a policy-configured splash isolate (ADR 0002 reference host)"

[dependencies]
octosense-app-validator = { path = "../app-validator" }
octosense-app-policy = { path = "../app-policy", features = ["splash"] }
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "a5a3cf5b0dbd1b56c25defe6d98479f25843e770", features = ["maps"] }
octoscript-makepad = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "b90be8f5248c70b300dba746811c904673da7f02" }
# The lint and realize report card-host logs for card-studio; the workspace
# patch resolves it to the same checkout octoscript-makepad uses.
octoscript-ui-l0 = { git = "https://github.com/OctoSense-org/Octoscript.git", rev = "76032ed4b0a9cce346cbc9e4f9f30fe00d76e65b" }
octoscript-widgets = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "b90be8f5248c70b300dba746811c904673da7f02" }
serde_json = "1"
octosense-appstore = { path = "../appstore" }

[[bin]]
name = "card-host"
path = "src/main.rs"
