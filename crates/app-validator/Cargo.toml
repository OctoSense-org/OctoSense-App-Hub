[package]
name = "octosense-app-validator"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Shared Card preparation and a native validation worker"

[dependencies]
octosense-app-hub = { path = "../app-hub" }
octosense-app-policy = { path = "../app-policy", features = ["splash"] }
octosense-app-runtime = { path = "../app-runtime" }
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "a5a3cf5b0dbd1b56c25defe6d98479f25843e770" }
octoscript-makepad = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "b90be8f5248c70b300dba746811c904673da7f02" }
octoscript-render = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "b90be8f5248c70b300dba746811c904673da7f02" }
octoscript-widgets = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "b90be8f5248c70b300dba746811c904673da7f02" }
serde_json = "1"
blake3 = "1"
rand_core = { version = "0.9", features = ["os_rng"] }

[dev-dependencies]
base64 = "0.22"

[[bin]]
name = "app-validator"
path = "src/main.rs"
