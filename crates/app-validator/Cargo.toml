[package]
name = "octosense-app-validator"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Shared Card preparation and a native validation worker"

[dependencies]
octosense-app-hub = { path = "../app-hub" }
octosense-app-policy = { path = "../app-policy", features = ["splash"] }
octosense-app-runtime = { path = "../app-runtime" }
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "975c5630e01b0f3f3ae16cafd2e0fce3c9a5f7d9" }
octoscript-makepad = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "7fa5f23e97eee7e221d76d1487b9d1e27f1ba7c2" }
octoscript-render = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "7fa5f23e97eee7e221d76d1487b9d1e27f1ba7c2" }
octoscript-widgets = { git = "https://github.com/OctoSense-org/Octoscript-Makepad.git", rev = "7fa5f23e97eee7e221d76d1487b9d1e27f1ba7c2" }
serde_json = "1"
blake3 = "1"
rand_core = { version = "0.9", features = ["os_rng"] }

[dev-dependencies]
base64 = "0.22"

[[bin]]
name = "app-validator"
path = "src/main.rs"
