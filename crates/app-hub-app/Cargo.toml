# octosense-app-hub-app — the shell integration every OctoSense shell links:
# the native App Hub store module, the Card runner module, the system-app
# registry packed at build time (OCTOSENSE_SYSTEM_APPS, see build.rs and
# README.md), installed apps and icons.
[package]
name = "octosense-app-hub-app"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "The App Hub shell integration: store module, Card runner, system apps and icons"

[features]
default = ["text-input-state-query"]
text-input-state-query = ["octosense-appstore/text-input-state-query"]

[dependencies]
makepad-widgets = { git = "https://github.com/OctoSense-org/makepad.git", rev = "32d6415fb7476345ad36ee4f98d6f844d1f07fd2" }
makepad-app-module = { git = "https://github.com/OctoSense-org/makepad.git", rev = "32d6415fb7476345ad36ee4f98d6f844d1f07fd2" }
makepad-wm-theme = { git = "https://github.com/OctoSense-org/makepad.git", rev = "32d6415fb7476345ad36ee4f98d6f844d1f07fd2" }
octosense-app-hub = { path = "../app-hub" }
octosense-app-policy = { path = "../app-policy" }
octosense-appstore = { path = "../appstore", default-features = false }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
serde_json = "1"
# Packs the selected system apps (build.rs).
octosense-app-hub = { path = "../app-hub" }
