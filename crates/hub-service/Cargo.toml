[package]
name = "octosense-hub-service"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Publisher identity and submission control plane for the OctoSense App Hub"

[dependencies]
axum = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
blake3 = "1"
rand_core = { version = "0.9", features = ["os_rng"] }
ed25519-dalek = "3"
hex = "0.4"
ureq = "3"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "hub-service"
path = "src/main.rs"
